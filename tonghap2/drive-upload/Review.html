<!doctype html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생애주기 · 반별 제출 현황</title><style>
:root{--ink:#173345;--muted:#607887;--line:#d6e2e7;--blue:#21668c;--teal:#16766a;--bg:#f1f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,'Malgun Gothic',sans-serif}button,input,select{font:inherit}button,a.action{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 13px;color:var(--ink);cursor:pointer;text-decoration:none}button:hover,a.action:hover{border-color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9ad39;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}header{background:white;border-bottom:1px solid var(--line);padding:24px max(24px,calc((100vw - 1420px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:3px 0;font-size:28px;letter-spacing:-1px}.eyebrow{font-size:12px;color:var(--teal);font-weight:800;letter-spacing:1px}.sub{font-size:13px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1468px;margin:auto;padding:22px 24px}.status{padding:10px 14px;margin-bottom:14px;background:#e7f1f5;border-radius:8px;font-size:14px}.error{background:#fff0df;color:#7d4017}.classes{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:17px}.classes button{text-align:left;padding:13px}.classes button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}.classes b{display:block;font-size:15px}.classes small{font-size:12px;opacity:.85}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{border:1px solid var(--line);background:white;border-radius:10px;padding:12px 18px}.stat strong{font-size:28px;margin-right:8px}.stat span{font-size:13px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(400px,.85fr) minmax(500px,1.15fr);gap:16px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{padding:15px;border-bottom:1px solid var(--line)}h2{font-size:18px;margin:0 0 8px}.filters{display:flex;gap:7px}.filters input{flex:1;min-width:0}.filters input,.filters select{padding:9px;border:1px solid var(--line);border-radius:7px;background:white}.student-list{max-height:670px;overflow:auto;padding:8px}.student{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;text-align:left;margin-bottom:6px;padding:10px;border-color:transparent;background:#f7fafb}.student[aria-pressed=true]{background:#e3f0f6;border-color:var(--blue)}.number{width:32px;height:32px;background:white;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800}.student .name{font-weight:750;overflow-wrap:anywhere}.student small{font-size:12px;color:var(--muted);display:block}.badge{font-size:12px;border-radius:20px;padding:4px 9px;white-space:nowrap;background:#edf1f3;color:#5e707d}.badge.done{background:#e1f2e8;color:#1e6544}.badge.warn{background:#fff0d6;color:#8b5710}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.viewer-top{padding:16px;border-bottom:1px solid var(--line)}.viewer-top h2{margin-bottom:4px;overflow-wrap:anywhere}.viewer-top p{margin:5px 0;font-size:13px;overflow-wrap:anywhere}.viewer-top .actions{margin-top:10px}.viewer-top select{max-width:100%;padding:8px;border:1px solid var(--line);border-radius:6px}.warning{padding:10px;background:#fff4df;border-radius:7px;margin:10px 0!important}.pdf{width:100%;height:70vh;min-height:500px;border:0;display:block;background:#edf1f3}.note{font-size:12px;color:var(--muted);padding:10px 15px}.unmatched{margin-top:18px;background:white;border:1px solid var(--line);border-radius:9px;padding:14px}.unmatched summary{cursor:pointer;font-weight:700}.unmatched p{font-size:13px}.orphan{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.linkbutton{background:var(--blue)!important;color:white!important}.aliaslist{font-size:12px;color:var(--muted)}@media(max-width:1000px){.classes{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:1fr}.student-list{max-height:420px}.pdf{height:75vh}header{align-items:flex-start}}@media(max-width:540px){header{padding:18px;display:block}.actions{margin-top:12px}main{padding:14px}.classes{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}h1{font-size:23px}.student{grid-template-columns:30px 1fr auto}.badge{font-size:11px}.pdf{min-height:380px}}

.overview{margin-bottom:22px}.overview h2{font-size:23px}.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.overview-card{padding:18px;background:#173345;color:white;border-radius:12px}.overview-card strong{font-size:32px;display:block}.overview-card small{color:#c8dee9}.rate-table{width:100%;border-collapse:collapse;background:white;font-size:14px}.rate-table th,.rate-table td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line)}.rate-table button{padding:5px 9px}.bar{height:8px;background:#e4edf0;border-radius:8px;overflow:hidden;min-width:65px;margin-top:4px}.bar i{display:block;height:100%;background:#16766a}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.review-form{padding:16px;background:#f3f8fa;border-bottom:1px solid var(--line)}.review-form label{display:block;font-weight:700;margin:6px 0}.review-form select,.review-form textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px}.review-form textarea{min-height:70px;resize:vertical}.review-form p{font-size:12px;color:var(--muted)}.management-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.overview-note{font-size:13px;color:var(--muted)}@media(max-width:600px){.overview-grid{grid-template-columns:repeat(2,1fr)}.overview-card{padding:12px}.rate-table th,.rate-table td{padding:8px;white-space:nowrap}}
</style></head><body><header><div><div class="eyebrow">통합사회2 · 교사용</div><h1>수업 관리 · 전체 현황</h1><p class="sub">학년·반·번호로 모으고, 학생을 선택해 결과 PDF를 확인합니다.</p></div><div class="actions"><a class="action" href="https://kste200267-boop.github.io/teaching-tools/tonghap2/life.html" target="_blank" rel="noopener">수업 사이트</a><a class="action" id="folder" href="https://drive.google.com/drive/folders/1YvlPnksToDThz0If5Efh_jiF4OteGwnd" target="_blank" rel="noopener">Drive 폴더</a><button id="refresh" class="linkbutton">새로고침</button></div></header><main><div class="status" id="status" role="status">교사 계정과 제출물을 확인하고 있습니다…</div><section id="overview" aria-label="전체 제출 통계"></section><nav class="classes" id="classes" aria-label="학급 선택"></nav><section class="stats" id="stats" aria-label="선택 학급 제출 통계"></section><div class="workspace"><section class="panel"><div class="panel-head"><h2 id="classTitle">학생 목록</h2><div class="filters"><input id="search" aria-label="학생 이름 또는 번호 검색" placeholder="이름·제출 이름·번호 검색"><select id="filter" aria-label="제출 상태 필터"><option value="all">전체</option><option value="done">제출</option><option value="missing">미제출</option><option value="check">이름 확인</option><option value="reviewed">검토 완료</option><option value="revise">보완 필요</option><option value="pending">검토 전</option></select></div></div><div id="students" class="student-list"></div><p class="note">‘제출’은 파일 도착 여부입니다. 이름이 다르면 본인 확인 후 사용 이름으로 등록하세요.</p></section><section class="panel" id="viewer" aria-label="선택한 학생의 제출 PDF"><div class="empty">학급과 학생을 선택하면<br>이곳에서 PDF를 확인할 수 있습니다.</div></section></div><details id="unmatched" class="unmatched" hidden></details><p class="note">이름의 영문 대소문자와 띄어쓰기는 자동으로 정리합니다. 한글 표기·별칭은 교사가 확인한 뒤 등록합니다. 재제출한 파일도 모두 보존하며 최신 제출본을 먼저 보여 줍니다.</p></main><script>
let data=null,classIndex=0,selectedKey='',selectedFile='',busy=false;
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=s=>s?new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'시간 정보 없음';
function warn(r){return r.files.some(f=>!f.nameVerified);}
function currentRows(){return data.rows.filter(r=>r.cls===data.classes[classIndex]);}
function paint(){
 paintOverview();
 $('classes').innerHTML=data.classes.map((c,i)=>{const rows=data.rows.filter(r=>r.cls===c);return '<button data-class="'+i+'" aria-pressed="'+(i===classIndex)+'"><b>'+esc(c.replace('과 ', ' '))+'</b><small>'+rows.filter(r=>r.files.length).length+' / '+rows.length+'명 제출</small></button>';}).join('');
 const rows=currentRows(),done=rows.filter(r=>r.files.length).length;
 $('stats').innerHTML=[[rows.length,'전체 학생'],[done,'제출'],[rows.length-done,'미제출'],[rows.filter(warn).length,'이름 확인']].map(x=>'<div class="stat"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('');
 $('classTitle').textContent='1학년 '+data.classes[classIndex];paintList();paintViewer();
 $('unmatched').hidden=!data.unmatched.length;
 $('unmatched').innerHTML='<summary>명렬 연결 확인 / 제외 파일 '+data.unmatched.length+'개</summary><p>학년·반·번호 또는 파일명을 확인해 주세요. 현재 명렬에 없는 학생이나 다른 학년의 파일도 여기에 표시됩니다.</p>'+data.unmatched.map(f=>'<div class="orphan"><span>'+esc(f.fileName)+(f.excluded?' · 통계 제외':'')+'</span><button data-orphan="'+esc(f.id)+'">PDF 보기</button></div>').join('');
}
function paintList(){if(!data)return;const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;const rows=currentRows().filter(r=>(!q||[r.name,r.number].concat(r.aliases,r.files.map(f=>f.enteredName)).join(' ').toLowerCase().includes(q))&&(filter==='all'||filter==='done'&&r.files.length||filter==='missing'&&!r.files.length||filter==='check'&&warn(r)||filter==='reviewed'&&r.files[0]?.review?.status==='reviewed'||filter==='revise'&&r.files[0]?.review?.status==='revise'||filter==='pending'&&r.files.length&&(!r.files[0].review?.status||r.files[0].review.status==='pending')));
 $('students').innerHTML=rows.length?rows.map(r=>'<button class="student" data-key="'+esc(r.key)+'" aria-pressed="'+(r.key===selectedKey)+'"><span class="number">'+r.number+'</span><span><span class="name">'+esc(r.name)+'</span><small>'+(r.files.length?'제출 이름: '+esc(r.files[0].enteredName)+' · '+when(r.files[0].created):'아직 제출된 PDF가 없습니다.')+'</small></span><span class="badge '+(warn(r)?'warn':r.files.length?'done':'')+'">'+(warn(r)?'제출 · 이름 확인':r.files.length?'제출 '+r.files.length+'건':'미제출')+'</span></button>').join(''):'<div class="empty">조건에 맞는 학생이 없습니다.</div>';
}
function pdfMarkup(f){if(!/^[A-Za-z0-9_-]+$/.test(f.id))return '<p>올바른 파일 ID가 아닙니다.</p>';return '<iframe class="pdf" title="학생 제출 PDF 미리보기" src="https://drive.google.com/file/d/'+f.id+'/preview" allow="fullscreen"></iframe><p class="note">미리보기가 열리지 않으면 ‘Drive에서 열기’를 눌러 확인하세요.</p>';}
function paintViewer(){if(!data)return;const r=data.rows.find(r=>r.key===selectedKey);if(!r){$('viewer').innerHTML='<div class="empty">학생을 선택하면 PDF와 제출 이력이 표시됩니다.</div>';return;}
 const f=r.files.find(f=>f.id===selectedFile)||r.files[0];selectedFile=f?f.id:'';
 let top='<div class="viewer-top"><h2>'+r.number+'번 '+esc(r.name)+'</h2><p>'+esc(r.cls)+'</p>';
 if(!f){$('viewer').innerHTML=top+'</div><div class="empty">아직 제출되지 않았습니다.</div>';return;}
 top+='<p>제출 이름: <b>'+esc(f.enteredName)+'</b> · '+when(f.created)+'</p><label for="versions" class="sub">제출 이력 (최신순)</label><br><select id="versions">'+r.files.map((x,i)=>'<option value="'+esc(x.id)+'" '+(x.id===f.id?'selected':'')+'>'+(i===0?'최신 · ':'')+when(x.created)+' · '+esc(x.enteredName)+'</option>').join('')+'</select>';
 if(!f.nameVerified)top+='<p class="warning">번호는 명렬과 같지만 이름 표기가 다릅니다. 본인이 맞는지 확인한 뒤 등록해 주세요.<br><button id="approve">이 이름을 사용 이름으로 등록</button></p>';
 if(r.aliases.length)top+='<p class="aliaslist">확인한 사용 이름: '+r.aliases.map(esc).join(', ')+'</p>';
 top+='<div class="actions"><a class="action linkbutton" href="https://drive.google.com/file/d/'+esc(f.id)+'/view" target="_blank" rel="noopener">Drive에서 열기</a><button id="prev">이전 학생</button><button id="next">다음 학생</button></div></div>';
 $('viewer').innerHTML=top+reviewForm(f)+pdfMarkup(f);
}
function load(){if(busy)return;busy=true;$('refresh').disabled=true;$('status').className='status';$('status').textContent='Drive에서 최신 제출물을 불러오고 있습니다…';
 if(!(window.google&&google.script&&google.script.run)){busy=false;$('refresh').disabled=false;$('status').textContent='교사용 Google Apps Script 주소에서 열어 주세요. 이 파일 자체에는 명렬이나 제출물이 들어 있지 않습니다.';return;}
 google.script.run.withSuccessHandler(result=>{data=result;busy=false;$('refresh').disabled=false;paint();$('status').textContent='최근 확인 '+when(result.updated)+' · 명렬 '+result.rows.length+'명 · 새 제출은 새로고침으로 확인하세요.';}).withFailureHandler(error=>{busy=false;$('refresh').disabled=false;$('status').className='status error';$('status').textContent='불러오지 못했습니다. '+(error.message||'교사 계정과 연결을 확인해 주세요.');}).getReviewData();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.class!==undefined){classIndex=Number(b.dataset.class);selectedKey='';selectedFile='';$('search').value='';$('filter').value='all';paint();}if(b.dataset.key){selectedKey=b.dataset.key;selectedFile='';paintList();paintViewer();}if(b.dataset.orphan){const f=data.unmatched.find(f=>f.id===b.dataset.orphan);if(f){selectedKey='';$('viewer').innerHTML='<div class="viewer-top"><h2>명렬 연결 확인</h2><p>'+esc(f.fileName)+'</p><a class="action" href="https://drive.google.com/file/d/'+esc(f.id)+'/view" target="_blank" rel="noopener">Drive에서 열기</a></div>'+reviewForm(f)+pdfMarkup(f);paintList();}}if(b.id==='refresh')load();if(b.id==='prev'||b.id==='next'){const rows=currentRows(),idx=rows.findIndex(r=>r.key===selectedKey),next=idx+(b.id==='next'?1:-1);if(rows[next]){selectedKey=rows[next].key;selectedFile='';paintList();paintViewer();}}if(b.id==='approve'){const r=data.rows.find(r=>r.key===selectedKey),f=r&&r.files.find(f=>f.id===selectedFile);if(!f)return;if(!confirm(r.cls+' '+r.number+'번 '+r.name+' 학생이 “'+f.enteredName+'”으로 제출한 것이 맞나요?'))return;b.disabled=true;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(error=>{b.disabled=false;$('status').className='status error';$('status').textContent=error.message||'등록하지 못했습니다.';}).approveStudentAlias(r.key,f.enteredName);}});
document.addEventListener('change',e=>{if(e.target.id==='filter')paintList();if(e.target.id==='versions'){selectedFile=e.target.value;paintViewer();}});$('search').addEventListener('input',paintList);

function reviewForm(f){const v=f.review||{};return '<div class="review-form"><label for="reviewStatus">교사 검토 상태</label><select id="reviewStatus">'+[['pending','검토 전'],['reviewed','검토 완료'],['revise','보완 필요'],['excluded','테스트·잘못된 제출: 통계 제외']].map(x=>'<option value="'+x[0]+'" '+((v.status||'pending')===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><label for="reviewNote">교사 메모</label><textarea id="reviewNote" maxlength="1000" placeholder="예: 청년기 목표 금액과 저축액의 연결 확인">'+esc(v.note||'')+'</textarea><button id="saveReview" data-file="'+esc(f.id)+'">검토 저장</button><p>교사만 보는 메모입니다. 학생에게 자동 전달되거나 점수로 환산되지 않습니다. 통계 제외는 파일을 삭제하지 않으며 여기서 되돌릴 수 있습니다.</p><div id="reviewFeedback" role="status"></div></div>';}
function metrics(rows){let done=rows.filter(r=>r.files.length),reviewed=done.filter(r=>r.files[0].review?.status==='reviewed').length,revise=done.filter(r=>r.files[0].review?.status==='revise').length;return {total:rows.length,done:done.length,missing:rows.length-done.length,check:done.filter(warn).length,reviewed,revise,pending:done.length-reviewed-revise,rate:rows.length?Math.round(done.length/rows.length*100):0};}
function paintOverview(){const m=metrics(data.rows),excluded=data.unmatched.filter(f=>f.excluded).length; $('overview').innerHTML='<div class="overview"><h2>전체 학급 한눈에 보기</h2><div class="overview-grid">'+[[m.total,'전체 학생'],[m.done,'제출 · '+m.rate+'%'],[m.missing,'미제출'],[m.reviewed,'최신본 검토 완료']].map(x=>'<div class="overview-card"><strong>'+x[0]+'명</strong><small>'+x[1]+'</small></div>').join('')+'</div><p class="overview-note">검토 전 '+m.pending+'명 · 보완 필요 '+m.revise+'명 · 이름 확인 '+m.check+'명 · 통계 제외 '+excluded+'개 · 명렬 미연결 '+(data.unmatched.length-excluded)+'개</p><div class="table-scroll"><table class="rate-table"><thead><tr><th>학급</th><th>제출률</th><th>제출 / 전체</th><th>미제출</th><th>검토 완료</th><th>보완 필요</th></tr></thead><tbody>'+data.classes.map((c,i)=>{const x=metrics(data.rows.filter(r=>r.cls===c));return '<tr><td><button data-class="'+i+'">'+esc(c)+'</button></td><td>'+x.rate+'%<div class="bar"><i style="width:'+x.rate+'%"></i></div></td><td>'+x.done+' / '+x.total+'</td><td>'+x.missing+'</td><td>'+x.reviewed+'</td><td>'+x.revise+'</td></tr>';}).join('')+'</tbody></table></div><div class="management-tools"><button id="exportAll">전체 현황 CSV 저장</button><button id="exportMissing">미제출 명단 CSV 저장</button><button id="exportClass">선택 반 CSV 저장</button></div><p class="overview-note">제출률은 PDF 도착 기준이며 학습 성취도나 점수가 아닙니다. 검토 상태는 최신 제출본 기준입니다. 작성 중인 학생의 실시간 진행률은 수집하지 않습니다.</p></div>';}
function exportRows(rows,label){const safe=s=>'"'+String(s??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const lines=[['학년','학급','번호','명렬 이름','제출 이름','제출 상태','검토 상태','이름 확인','제출본 수','최신 제출','교사 메모','PDF 링크']];rows.forEach(r=>{const f=r.files[0],v=f?.review||{};lines.push([r.grade,r.cls,r.number,r.name,f?.enteredName||'',f?'제출':'미제출',f?({reviewed:'검토 완료',revise:'보완 필요',pending:'검토 전'}[v.status]||'검토 전'):'',warn(r)?'필요':'',r.files.length,f?.created||'',v.note||'',f?'https://drive.google.com/file/d/'+f.id+'/view':'']);});const blob=new Blob(['\ufeff'+lines.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='생애주기_'+label+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!data)return;if(b.id==='exportAll')exportRows(data.rows,'전체현황');if(b.id==='exportMissing')exportRows(data.rows.filter(r=>!r.files.length),'미제출');if(b.id==='exportClass')exportRows(currentRows(),data.classes[classIndex]);if(b.id==='saveReview'){b.disabled=true;const file=b.dataset.file,status=$('reviewStatus').value,note=$('reviewNote').value;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(error=>{b.disabled=false;$('reviewFeedback').textContent='저장 실패: '+(error.message||'다시 시도해 주세요.');}).saveReviewStatus(file,status,note);}});

load();
</script></body></html>
